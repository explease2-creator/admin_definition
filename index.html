<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>法学 定義暗記 SYSTEM v2.0</title>

<style>
body {
    font-family: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 15px;
    padding-bottom: 90px; 
    -webkit-text-size-adjust: 100%;
}

.top {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* 🏛️ 최상위 7법 과목 선택 탭 */
.subject-tab {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    background: #e2e8f0;
    padding: 6px;
    border-radius: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.subject-tab::-webkit-scrollbar {
    display: none;
}

.subject-tab button {
    flex: 0 0 auto;
    padding: 9px 13px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #4a5568;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    margin-top: 0;
}

.subject-tab button.active {
    background: #2c3e50;
    color: white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

/* 카드 */
.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* 機能 タブ */
.tab {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.tab button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #ddd;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 0;
}

.tab button.active {
    background: #2d6cdf;
    color: white;
}

/* 入力項目 */
textarea, input, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    font-size: 16px; 
}

.form-label {
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin-top: 10px;
    display: block;
}

button {
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #2d6cdf;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

/* 問題表示 */
.question {
    padding: 15px;
    border-left: 4px solid #2d6cdf;
    background: #fafafa;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.8;
    position: relative;
}

/* 정의명 헤더 스타일 */
.q-term-title {
    font-size: 16px;
    font-weight: bold;
    color: #1a0dab;
    padding-bottom: 6px;
    margin-bottom: 8px;
    border-bottom: 1px dashed #d1d5db;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
}

/* 문제 본문 전용 스타일 */
.q-body {
    white-space: pre-wrap;
    margin-top: 6px;
}

.tag-badge {
    display: inline-block;
    background: #e1ecf8;
    color: #2d6cdf;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    margin-right: 5px;
    margin-top: 4px;
    font-weight: bold;
}

.importance-badge {
    display: inline-block;
    background: #fff3cd;
    color: #856404;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    margin-right: 5px;
    margin-top: 4px;
    font-weight: bold;
}

/* 인라인 빈칸 입력창 */
.inline-blank-container {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    vertical-align: middle;
    margin: 0 3px;
    max-width: 100%;
}

.inline-input {
    display: inline-block;
    width: auto;
    min-width: 80px;
    max-width: 100%;
    padding: 4px 8px;
    margin: 0;
    font-size: 15px;
    font-weight: bold;
    border: 2px solid #2d6cdf;
    border-radius: 6px;
    background: #fff;
    color: #333;
    outline: none;
    text-align: center;
    box-sizing: border-box;
}

/* 채점 상태 스타일 */
.inline-input.status-correct {
    background-color: #e8f0fe;
    border-color: #2d6cdf;
    color: #2d6cdf;
    font-weight: bold;
}

.inline-input.status-wrong {
    background-color: #fce8e6;
    border-color: #d93025;
    color: #d93025;
}

/* 오답 정답 힌트 */
.inline-wrong-hint {
    font-size: 13px;
    font-weight: bold;
    color: #d93025;
    margin-left: 4px;
    white-space: normal;
    word-break: break-all;
    display: inline;
}

.blankSymbol {
    display: inline-block;
    color: #2d6cdf;
    font-weight: bold;
    border-bottom: 2px solid #2d6cdf;
    padding: 0 4px;
    margin: 0 2px;
}

/* 문단 들여쓰기 클래스 */
.indent-block {
    display: inline-block;
    padding-left: 1.5em;
    margin: 0;
    width: calc(100% - 1.5em);
    vertical-align: top;
}

.hidden { display: none !important; }
small { color: gray; font-size: 12px; }

/* DBグループ */
.group {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
    background: #f9f9f9;
}

.group-title {
    font-weight: bold;
    font-size: 15px;
    color: #2d6cdf;
    margin-bottom: 5px;
}

#examOut {
    padding-bottom: 60px;
}

/* 下部固定ボタンバー */
.gradeBar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(5px);
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
    box-shadow: 0 -3px 15px rgba(0,0,0,0.1);
    z-index: 999;
    display: flex;
    justify-content: center;
    box-sizing: border-box;
}

.gradeBar button {
    width: 90%;
    font-size: 16px;
    padding: 14px;
    margin-top: 0;
    transition: width 0.2s ease;
}

.gradeBar button.half {
    width: 47%;
}

/* 📱 修正用 モーダル */
.modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}
.modal-actions button {
    flex: 1;
}
</style>
</head>

<body>

<div class="top">⚖️ 法学 定義暗記 SYSTEM v2.0</div>

<!-- 🏛️ 7법 최상위 과목 탭 -->
<div class="subject-tab">
    <button class="btn-subject active" data-subject="constitution" data-title="憲法">📜 憲法</button>
    <button class="btn-subject" data-subject="admin" data-title="行政法">🏛️ 行政法</button>
    <button class="btn-subject" data-subject="civil" data-title="民法">📘 民法</button>
    <button class="btn-subject" data-subject="civ_pro" data-title="民事訴訟法">📑 民訴法</button>
    <button class="btn-subject" data-subject="comm" data-title="商法">🏢 商法</button>
    <button class="btn-subject" data-subject="penal" data-title="刑法">📕 刑法</button>
    <button class="btn-subject" data-subject="crim_pro" data-title="刑事訴訟法">⚖️ 刑訴法</button>
</div>

<!-- 기능 탭切り替え -->
<div class="tab">
<button id="btnDB" class="active">📚 データベース</button>
<button id="btnExam">🎯 穴埋め試験</button>
</div>

<!-- ================= DB管理画面 ================= -->
<div id="dbArea" class="card">
<h3 id="dbTitle">📥 [憲法] 定義登録</h3>
<input id="defTerm" placeholder="定義名・概念名 (例: {違憲審査権}, 撤回 など)">
<input id="tags" placeholder="タグ (カンマ(,)で複数入力可. 例: 司法権, 統治機構)">
<input id="importance" placeholder="重要度 (例: A, B, 重要度高 など)">
<textarea id="qText" rows="5" placeholder="定義文 ( 空欄: {正解} / 強調: **テキスト** / 들여쓰기: > テキスト )"></textarea>
<button id="btnAddQ">追加する</button>
<hr>
<button id="btnToggleDB">📚 登録定義の一覧 表示/非表示</button>
<div id="dbView" class="hidden"></div>
</div>

<!-- ================= 試験画面 ================= -->
<div id="examArea" class="card hidden">
<h3 id="examTitle">🎯 [憲法] 試験作成</h3>

<!-- タグ別モード -->
<div id="tagMode">
    <span class="form-label">🏷️ タグを選択 (出題範囲)</span>
    <select id="tagSelect"></select>
    
    <span class="form-label">📝 出題問題数</span>
    <input id="count" type="number" pattern="[0-9]*" placeholder="出題問題数">
    <button id="btnStartTag">試験開始</button>
</div>

<div id="examOut"></div>
</div>

<!-- 下部固定操作バー -->
<div id="examCtrlArea" class="gradeBar hidden">
    <button id="btnGrade" style="background: #27ae60;">🎯 答え合わせ（採点）</button>
    <button id="btnRetryWrong" class="hidden" style="background: #e67e22; margin-left: 10px;">🔁 誤答のみ再出題</button>
</div>

<!-- 📱 修正モーダル -->
<div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>✏️ 定義の修正</h3>
        <input id="editDefTerm" placeholder="定義名・概念名">
        <input id="editTags" placeholder="タグ (カンマで区切る)">
        <input id="editImportance" placeholder="重要度">
        <textarea id="editQText" rows="6" placeholder="定義文"></textarea>
        <div class="modal-actions">
            <button id="btnCancelEdit" style="background: #95a5a6;">キャンセル</button>
            <button id="btnSaveEdit" style="background: #27ae60;">保存する</button>
        </div>
    </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCXguxQRx0qF0hhPZ0HXRO3gYXea9HJjao",
    authDomain: "const-slot.firebaseapp.com",
    projectId: "const-slot",
    storageBucket: "const-slot.firebasestorage.app",
    messagingSenderId: "396005964783",
    appId: "1:396005964783:web:de2fa4d6928b6ab756541a"
};

const app = initializeApp(firebaseConfig);
const dbInstance = getFirestore(app);

/* ================= 🏛️ 과목 상태 및 Firestore 연결 관리 ================= */
let currentSubject = "constitution";
let currentSubjectTitle = "憲法";
let docRef = null;
let unsubscribeDoc = null;

let db = []; 
let currentTest = [];
let editingIndex = null; 

function getCircNum(index) {
    return `(${index + 1})`;
}

// 과목 전환 함수
function switchSubject(subjectKey, subjectTitle) {
    currentSubject = subjectKey;
    currentSubjectTitle = subjectTitle;

    // 제목 업데이트
    document.getElementById("dbTitle").textContent = `📥 [${currentSubjectTitle}] 定義登録`;
    document.getElementById("examTitle").textContent = `🎯 [${currentSubjectTitle}] 試験作成`;

    // 기존 리스너 해제
    if (unsubscribeDoc) {
        unsubscribeDoc();
    }

    // 기존 행정법 데이터 보존 호환성 처리
    if (currentSubject === "admin") {
        docRef = doc(dbInstance, "admin_exam", "admin_db_doc");
    } else {
        docRef = doc(dbInstance, "def_exam_db", currentSubject);
    }

    // 시험 진행 상태 초기화
    currentTest = [];
    document.getElementById("examOut").innerHTML = "";
    document.getElementById("examCtrlArea").classList.add("hidden");

    // 새 과목 DB 리스닝
    unsubscribeDoc = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            db = data.questions ? data.questions : [];
        } else {
            db = [];
        }
        renderDB();
        refreshDropdowns();
    });
}

async function saveToFirestore(newData) {
    if (!docRef) return;
    try {
        await setDoc(docRef, { questions: newData });
    } catch (error) {
        console.error("Error saving data:", error);
    }
}

function refreshDropdowns() {
    renderTagSelect();
}

function formatText(str) {
    if (!str) return "";
    
    let formatted = str.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
    let lines = formatted.split("\n");
    let resultLines = lines.map(line => {
        let trimmed = line.trim();
        if (trimmed.startsWith("&gt;")) {
            let content = trimmed.replace(/^&gt;\s?/, "");
            return `<span class="indent-block">${content}</span>`;
        } else if (trimmed.startsWith(">")) {
            let content = trimmed.replace(/^>\s?/, "");
            return `<span class="indent-block">${content}</span>`;
        }
        return line;
    });

    return resultLines.join("\n");
}

/* 💡 정의명 + 정의문 통합 렌더링 헬퍼 */
function processQuestionBlanks(rawText, globalIndexObj, mode = 'preview', qIdx = 0, solvedStatus = [], answers = [], userAnswers = []) {
    if (!rawText) return "";
    let formatted = formatText(rawText);

    return formatted.replace(/\{.*?\}/g, (match) => {
        let curIdx = globalIndexObj.count;
        globalIndexObj.count++;
        let num = getCircNum(curIdx);

        if (mode === 'preview') {
            return `<span class="blankSymbol">${num} ___</span>`;
        } else {
            let isSolved = solvedStatus && solvedStatus[curIdx];
            let ansText = answers[curIdx] || "";
            let userAns = userAnswers ? userAnswers[curIdx] : null;
            let inputWidth = Math.max(ansText.length * 16 + 20, 70);

            if (isSolved) {
                return `<span class="inline-blank-container"><input class="inline-input status-correct" style="width:${inputWidth}px;" value="${ansText}" disabled readonly></span>`;
            } else {
                let isGraded = userAns !== null;
                let statusClass = isGraded ? "status-wrong" : "";
                let hintHtml = isGraded ? `<span class="inline-wrong-hint">(${ansText})</span>` : "";
                let displayVal = userAns === null ? "" : userAns;

                return `<span class="inline-blank-container"><input class="inline-input ${statusClass}" id="ans_${qIdx}_${curIdx}" style="width:${inputWidth}px;" placeholder="${num}" value="${displayVal}" enterkeyhint="next">${hintHtml}</span>`;
            }
        }
    });
}

/* ================= 🏛️ 과목 탭 전환 이벤트 ================= */
document.querySelectorAll(".btn-subject").forEach(btn => {
    btn.addEventListener("click", (e) => {
        document.querySelectorAll(".btn-subject").forEach(b => b.classList.remove("active"));
        const targetBtn = e.target.closest(".btn-subject");
        targetBtn.classList.add("active");
        
        const subj = targetBtn.getAttribute("data-subject");
        const title = targetBtn.getAttribute("data-title");
        switchSubject(subj, title);
    });
});

/* ================= タブ切り替え ================= */
function showTab(tab) {
    const dbArea = document.getElementById("dbArea");
    const examArea = document.getElementById("examArea");
    const btnDB = document.getElementById("btnDB");
    const btnExam = document.getElementById("btnExam");

    if (tab === "db") {
        dbArea.classList.remove("hidden");
        examArea.classList.add("hidden");
        btnDB.classList.add("active");
        btnExam.classList.remove("active");
        document.getElementById("examCtrlArea").classList.add("hidden"); 
        renderDB();
    } else {
        examArea.classList.remove("hidden");
        dbArea.classList.add("hidden");
        btnExam.classList.add("active");
        btnDB.classList.remove("active");
        refreshDropdowns();
        if (currentTest.length > 0) {
            document.getElementById("examCtrlArea").classList.remove("hidden");
        }
    }
}

/* ================= データベース管理 ================= */
function toggleDB() {
    document.getElementById("dbView").classList.toggle("hidden");
}

function parseTags(tagStr) {
    if (!tagStr) return [];
    return tagStr.split(",").map(t => t.trim()).filter(t => t.length > 0);
}

function extractAnswers(termText, bodyText) {
    let termAns = [...(termText || "").matchAll(/\{(.*?)\}/g)].map(m => m[1]);
    let bodyAns = [...(bodyText || "").matchAll(/\{(.*?)\}/g)].map(m => m[1]);
    return [...termAns, ...bodyAns];
}

function addQ() {
    const defTerm = document.getElementById("defTerm").value;
    const tagStr = document.getElementById("tags").value;
    const importance = document.getElementById("importance").value;
    const question = document.getElementById("qText").value;

    if (!question.trim() && !defTerm.trim()) return;

    let answers = extractAnswers(defTerm, question);
    let tags = parseTags(tagStr);

    db.push({
        id: db.length + 1,
        defTerm,
        importance,
        tags,
        question,
        answers
    });

    saveToFirestore(db);

    document.getElementById("defTerm").value = "";
    document.getElementById("importance").value = "";
    document.getElementById("tags").value = "";
    document.getElementById("qText").value = "";
}

function deleteQ(index) {
    if(!confirm("本当に削除しますか？")) return;
    db.splice(index, 1);
    db = db.map((q, i) => ({ ...q, id: i + 1 }));
    saveToFirestore(db);
}

function openEditModal(index) {
    editingIndex = index;
    const q = db[index];
    document.getElementById("editDefTerm").value = q.defTerm || "";
    document.getElementById("editTags").value = q.tags ? q.tags.join(", ") : "";
    document.getElementById("editImportance").value = q.importance || "";
    document.getElementById("editQText").value = q.question || "";
    document.getElementById("editModal").style.display = "flex";
}

function closeEditModal() {
    document.getElementById("editModal").style.display = "none";
    editingIndex = null;
}

function saveEdit() {
    if (editingIndex === null) return;
    
    const defTerm = document.getElementById("editDefTerm").value;
    const question = document.getElementById("editQText").value;
    if (!question.trim() && !defTerm.trim()) return;

    let answers = extractAnswers(defTerm, question);
    
    db[editingIndex].defTerm = defTerm;
    db[editingIndex].importance = document.getElementById("editImportance").value;
    db[editingIndex].tags = parseTags(document.getElementById("editTags").value);
    db[editingIndex].question = question;
    db[editingIndex].answers = answers;

    saveToFirestore(db);
    closeEditModal();
}

function renderDB() {
    let grouped = {};

    db.forEach((q, idx) => {
        if (!q) return; 
        let primaryTag = (q.tags && q.tags.length > 0) ? q.tags[0] : "未分類";
        if (!grouped[primaryTag]) grouped[primaryTag] = [];
        grouped[primaryTag].push({ ...q, _idx: idx });
    });

    let sortedKeys = Object.keys(grouped).sort((a, b) => {
        if (a === "未分類") return 1;
        if (b === "未分類") return -1;
        return a.localeCompare(b, 'ja');
    });

    let html = "";
    sortedKeys.forEach(group => {
        html += `<div class="group"><div class="group-title">🏷️ ${group}</div>`;
        grouped[group].forEach(q => {
            let tagHtml = q.tags && q.tags.length > 0 ? q.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("") : "";
            let impHtml = q.importance ? `<span class="importance-badge">⭐ 重要度: ${q.importance}</span>` : "";
            
            let counter = { count: 0 };
            let formattedTerm = processQuestionBlanks(q.defTerm || "定義名なし", counter, 'preview');
            let formattedQ = processQuestionBlanks(q.question, counter, 'preview');

            html += `<div class="question"><div style="float:right; display:flex; gap:5px;"><button class="btn-edit-q" data-idx="${q._idx}" style="background:#f39c12; padding:5px 8px; font-size:12px; color:white; border:none; border-radius:4px; cursor:pointer; margin:0;">修正</button><button class="btn-delete" data-idx="${q._idx}" style="background:red; padding:5px 8px; font-size:12px; color:white; border:none; border-radius:4px; cursor:pointer; margin:0;">削除</button></div><div>${tagHtml}${impHtml}</div><div class="q-term-title">📘 ${formattedTerm}</div><div class="q-body">${formattedQ}</div></div>`;
        });
        html += `</div>`;
    });

    document.getElementById("dbView").innerHTML = html;

    document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", (e) => deleteQ(parseInt(e.target.getAttribute("data-idx"))));
    });
    document.querySelectorAll(".btn-edit-q").forEach(btn => {
        btn.addEventListener("click", (e) => openEditModal(parseInt(e.target.getAttribute("data-idx"))));
    });
}

function renderTagSelect() {
    const select = document.getElementById("tagSelect");
    const filteredDb = db.filter(q => q);
    
    let tagCounts = {};
    filteredDb.forEach(q => {
        if (q.tags && q.tags.length > 0) {
            q.tags.forEach(t => {
                tagCounts[t] = (tagCounts[t] || 0) + 1;
            });
        }
    });

    let totalQuestions = filteredDb.length;
    let html = `<option value="all">🌐 全体プール (${totalQuestions}問)</option>`;

    Object.keys(tagCounts).sort((a,b) => a.localeCompare(b, 'ja')).forEach(t => {
        html += `<option value="${t}">#${t} (${tagCounts[t]}問)</option>`;
    });

    select.innerHTML = html;
}

/* ================= 試験生成 & シャッフル ================= */
function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function resetGradeButtons() {
    document.getElementById("btnRetryWrong").classList.add("hidden");
    const btnGrade = document.getElementById("btnGrade");
    btnGrade.className = ""; 
    btnGrade.style.width = "90%";
    document.getElementById("examCtrlArea").classList.remove("hidden");
}

function prepareTestData(rawList) {
    return rawList.map(q => ({
        ...q,
        solvedStatus: new Array(q.answers.length).fill(false),
        userAnswers: new Array(q.answers.length).fill(null)
    }));
}

function makeTagTest() {
    let n = parseInt(document.getElementById("count").value || "1");
    const selectedTag = document.getElementById("tagSelect").value;
    
    let pool = db.filter(q => q);

    if (selectedTag !== "all") {
        pool = pool.filter(q => q.tags && q.tags.includes(selectedTag));
    }

    if (pool.length === 0) {
        alert("該当する問題がありません。");
        return;
    }

    let selectedQuestions = shuffle(pool).slice(0, n);
    currentTest = prepareTestData(selectedQuestions);
    
    let title = selectedTag === "all" 
        ? `🎯 [${currentSubjectTitle}] ランダム試験 [全体] (${currentTest.length}問)` 
        : `🏷️ [${currentSubjectTitle}] タグ別試験 [#${selectedTag}] (${currentTest.length}問)`;
    
    renderExam(currentTest, title);
    resetGradeButtons();
}

/* 💡 試験画面レンダリング */
function renderExam(testData, title) {
    let html = "";
    html += `<div class="examSession"><div class="examHeader">${title}</div>`;

    testData.forEach((q, i) => {
        let counter = { count: 0 };

        let maskedTerm = processQuestionBlanks(q.defTerm || "定義", counter, 'exam', i, q.solvedStatus, q.answers, q.userAnswers);
        let maskedBody = processQuestionBlanks(q.question, counter, 'exam', i, q.solvedStatus, q.answers, q.userAnswers);

        let tagHtml = q.tags && q.tags.length > 0 ? q.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("") : "";
        let impHtml = q.importance ? `<span class="importance-badge">⭐ 重要度: ${q.importance}</span>` : "";

        html += `<div class="question"><b>${i + 1}.</b> <div>${tagHtml}${impHtml}</div><div class="q-term-title">📘 ${maskedTerm}</div><div class="q-body">${maskedBody}</div></div>`;
    });

    html += `</div>`;
    document.getElementById("examOut").innerHTML = html;

    setTimeout(() => {
        const firstInput = document.querySelector(".inline-input:not([disabled])");
        if (firstInput) firstInput.focus();
        bindInputEvents();
    }, 100);
}

function bindInputEvents() {
    const inputs = Array.from(document.querySelectorAll(".inline-input:not([disabled])"));
    inputs.forEach((input, index) => {
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                const nextInput = inputs[index + 1];
                if (nextInput) nextInput.focus();
                else input.blur();
            }
        });
    });
}

/* ================= 答え合わせ（採点） ================= */
function grade() {
    if (currentTest.length === 0) return;

    let hasWrong = false;

    currentTest.forEach((q, i) => {
        for (let j = 0; j < q.answers.length; j++) {
            if (q.solvedStatus && q.solvedStatus[j]) continue;

            const inputEl = document.getElementById(`ans_${i}_${j}`);
            if (!inputEl) continue;

            let user = (inputEl.value || "").trim();
            let correct = q.answers[j].trim();

            q.userAnswers[j] = user;

            if (user === correct && user !== "") {
                q.solvedStatus[j] = true;
            } else {
                hasWrong = true;
            }
        }
    });

    renderExam(currentTest, document.querySelector(".examHeader").innerText);

    if (hasWrong) {
        const btnGrade = document.getElementById("btnGrade");
        btnGrade.className = "half";
        btnGrade.style.width = "47%";
        document.getElementById("btnRetryWrong").classList.remove("hidden");
    } else {
        alert("満点です！お見事！");
        resetGradeButtons();
    }
}

/* ================= 間違えた問題のみ再出題 ================= */
function retryWrongTests() {
    let wrongQuestions = [];

    currentTest.forEach((q) => {
        let hasUnsolved = q.solvedStatus.some(status => status === false);
        if (hasUnsolved) {
            q.userAnswers = q.userAnswers.map((ans, idx) => q.solvedStatus[idx] ? ans : null);
            wrongQuestions.push(q);
        }
    });

    if (wrongQuestions.length > 0) {
        currentTest = wrongQuestions;
        renderExam(currentTest, `🔁 [${currentSubjectTitle}] 誤答復習試験 (${currentTest.length}問)`);
        resetGradeButtons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

document.getElementById("btnDB").addEventListener("click", () => showTab("db"));
